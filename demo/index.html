<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No File Left Behind — demo</title>
<meta name="description" content="Closing several documents at once? Ask once, in one list, and never close anything if a save fails. Try the open pattern.">
<meta property="og:title" content="No File Left Behind — demo">
<meta property="og:description" content="Closing several documents at once? Ask once, in one list, and never close anything if a save fails.">
<meta property="og:image" content="https://raykholo.github.io/no-file-left-behind/images/social-card.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:url" content="https://raykholo.github.io/no-file-left-behind/demo/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://raykholo.github.io/no-file-left-behind/images/social-card.png">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1d2129; --muted: #69707d; --line: #d9dce1;
    --accent: #2f6fde; --accent-text: #ffffff; --danger: #c4302b; --ok: #1f8a4c; --shade: rgba(20, 24, 31, 0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181d; --panel: #22252c; --text: #e7e9ee; --muted: #9aa1ad; --line: #383c45;
      --accent: #4a8bf2; --accent-text: #ffffff; --danger: #ef6b66; --ok: #4cc283; --shade: rgba(0, 0, 0, 0.55); }
  }
  * { box-sizing: border-box; }
  a { color: var(--accent); }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  .app { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab { display: flex; align-items: center; border: 1px solid var(--line); border-bottom: none; border-radius: 8px 8px 0 0; background: var(--bg); }
  .tab button { border: none; background: none; border-radius: 6px; }
  .tab .open-tab { padding: 6px 4px 6px 12px; }
  .tab .x { padding: 2px 8px; margin-right: 4px; color: var(--muted); }
  .tab .x:hover { background: var(--line); color: var(--text); }
  .tabs .new-tab { border: none; background: none; padding: 4px 10px; font-size: 18px; line-height: 1; color: var(--muted); }
  .tabs .new-tab:hover { color: var(--text); background: var(--bg); }
  .tab.front { background: var(--panel); outline: 2px solid var(--accent); outline-offset: -2px; }
  .tab.front .open-tab { font-weight: 600; }
  .doc.front { outline: 2px solid var(--accent); outline-offset: -1px; }
  .docs { padding: 12px; display: grid; gap: 8px; }
  .doc { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
  .doc .where { color: var(--muted); font-size: 13px; }
  .doc .switches { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
  .bar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.small { padding: 2px 10px; font-size: 13px; }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .log { margin-top: 16px; font-size: 13px; color: var(--muted); }
  .log li.bad { color: var(--danger); } .log li.good { color: var(--ok); }
  .shade { position: fixed; inset: 0; background: var(--shade); display: none; align-items: center; justify-content: center; padding: 16px; }
  .shade.open { display: flex; }
  .dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; width: min(560px, 100%);
    max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
  .dialog h2 { font-size: 17px; margin: 0; padding: 16px 18px 8px; }
  .rows { overflow-y: auto; padding: 0 10px; }
  .row { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: start; padding: 8px; border-radius: 8px; }
  .row:hover { background: var(--bg); }
  .row .name { background: none; border: none; padding: 0; font-weight: 600; text-align: left; cursor: pointer; }
  .row .where, .row .note { grid-column: 2; font-size: 13px; color: var(--muted); }
  .row .note.bad { color: var(--danger); } .row .note.good { color: var(--ok); }
  .row .acts { grid-row: 1; grid-column: 3; display: flex; gap: 6px; }
  .foot { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .foot .spacer { flex: 1; }
  .dialog p { margin: 0; padding: 4px 18px 8px; }
  .dialog label.field { display: block; padding: 4px 18px 8px; }
  .dialog input[type=text] { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>No File Left Behind: demo</h1>
  <p class="lead">A pretend app with four documents. Change them, set the switches, then quit. Try making one fail or
    cancelling a "Save as": nothing closes. <a href="https://github.com/raykholo/no-file-left-behind/blob/main/SPEC.md">Specification</a></p>

  <div class="app">
    <div class="tabs" id="tabs"></div>
    <div class="docs" id="docs"></div>
    <div class="bar">
      <button class="primary" id="quit">Quit</button>
      <button id="close-all">Close All Tabs</button>
      <button id="reopen" title="Reopen what you closed last">Reopen Closed Tab</button>
      <button id="reset">Start over</button>
    </div>
  </div>
  <ol class="log" id="log" aria-live="polite"></ol>
</main>

<!-- The list of unsaved work -->
<div class="shade" id="list-shade">
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="list-title" aria-describedby="list-help">
    <h2 id="list-title"></h2>
    <p id="list-help" style="color:var(--muted);font-size:13px">Ticked documents are saved; the rest close without saving.</p>
    <div class="rows" id="rows"></div>
    <div class="foot">
      <button id="dont-save">Don't Save</button>
      <span class="spacer"></span>
      <button id="cancel">Cancel</button>
      <button class="primary" id="save-selected">Save Selected</button>
    </div>
  </div>
</div>

<!-- The familiar single prompt (one unsaved document) -->
<div class="shade" id="one-shade">
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="one-title">
    <h2 id="one-title"></h2>
    <p id="one-note" style="color:var(--muted);font-size:13px"></p>
    <div class="foot">
      <button id="one-dont">Don't Save</button>
      <span class="spacer"></span>
      <button id="one-cancel">Cancel</button>
      <button class="primary" id="one-save">Save</button>
    </div>
  </div>
</div>

<!-- A pretend "Save as" picker -->
<div class="shade" id="picker-shade">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="picker-title">
    <h2 id="picker-title"></h2>
    <label class="field">File name <input type="text" id="picker-name"></label>
    <div class="foot">
      <span class="spacer"></span>
      <button id="picker-cancel">Cancel</button>
      <button class="primary" id="picker-save">Save</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const START = [
  { name: "Bracket", path: "~/Designs/Bracket.sc", dirty: true },
  { name: "Lid", path: "~/Designs/Lid.sc", dirty: true },
  { name: "Untitled", path: null, dirty: true },
  { name: "Gearbox", path: "~/Designs/Gearbox.sc", dirty: false },
];
let docs, front, action, closing, rowNote, nextId, closedGroups;

function reset() {
  docs = START.map((d, i) => ({ ...d, id: i, readOnly: false, fails: false }));
  nextId = docs.length; closedGroups = [];
  front = 0; action = null; rowNote = {};
  $("log").replaceChildren();
  closeAll(); render();
}
function log(text, kind) {
  const li = document.createElement("li");
  li.textContent = text;
  if (kind) li.className = kind;
  $("log").append(li);
}
function render() {
  $("tabs").setAttribute("role", "tablist");
  $("tabs").replaceChildren(...docs.map((d) => {
    const t = document.createElement("span");
    t.className = "tab" + (d.id === front ? " front" : "");
    t.innerHTML = `<button class="open-tab" role="tab"></button><button class="x">×</button>`;
    const openBtn = t.querySelector(".open-tab"), x = t.querySelector(".x");
    openBtn.textContent = d.name + (d.dirty ? " •" : "");
    openBtn.setAttribute("aria-selected", String(d.id === front));
    openBtn.title = d.dirty ? `${d.name} has unsaved changes` : d.name;
    openBtn.onclick = () => { front = d.id; render(); };
    x.title = "Close " + d.name; x.setAttribute("aria-label", "Close " + d.name);
    x.onclick = () => start("tab", d); // one document: its own prompt (SPEC 1.2)
    return t;
  }));
  const plus = document.createElement("button");
  plus.className = "new-tab"; plus.textContent = "+"; plus.title = "New document"; plus.setAttribute("aria-label", "New document");
  plus.onclick = newDoc;
  $("tabs").append(plus);
  $("reopen").disabled = closedGroups.length === 0;
  $("docs").replaceChildren(...docs.map((d) => {
    const row = document.createElement("div");
    row.className = "doc" + (d.id === front ? " front" : "");
    row.innerHTML = `<div><strong></strong><div class="where"></div></div>
      <div class="switches">
        <label><input type="checkbox" data-k="dirty"> Unsaved changes</label>
        <label><input type="checkbox" data-k="readOnly"> Read-only file</label>
        <label><input type="checkbox" data-k="fails"> Save will fail</label>
      </div>`;
    row.querySelector("strong").textContent = d.name;
    row.querySelector(".where").textContent = d.path || "Not saved yet";
    for (const box of row.querySelectorAll("input")) {
      box.checked = d[box.dataset.k];
      box.disabled = box.dataset.k === "readOnly" && !d.path;
      box.onchange = () => { d[box.dataset.k] = box.checked; render(); };
    }
    return row;
  }));
}
function closeAll() { for (const id of ["list-shade", "one-shade", "picker-shade"]) $(id).classList.remove("open"); }
function open(id, focus) { $(id).classList.add("open"); (focus || $(id).querySelector("button.primary")).focus(); }

// Saving one document. Resolves true when it saved; false when it failed or its picker was cancelled.
function save(d) {
  return new Promise((done) => {
    const write = () => {
      if (d.fails) { rowNote[d.id] = ["bad", "The disk is full: free some space and try again."]; log(`${d.name}: save failed (disk full)`, "bad"); return done(false); }
      d.dirty = false; rowNote[d.id] = ["good", "Saved"]; log(`Saved ${d.name} to ${d.path}`, "good"); done(true);
    };
    if (d.path && !d.readOnly) return write();
    // Never saved, or the file can't be written: ask where, for this document only (SPEC 3.1, 6.1).
    $("picker-title").textContent = d.readOnly ? `${d.name} is read-only. Save a copy as…` : `Save “${d.name}” as…`;
    $("picker-name").value = d.name + ".sc";
    const finish = (ok) => {
      $("picker-shade").classList.remove("open");
      $("picker-save").onclick = $("picker-cancel").onclick = null;
      if (!ok) { rowNote[d.id] = ["bad", "Not saved: you cancelled choosing where."]; log(`${d.name}: “Save as” cancelled`, "bad"); return done(false); }
      d.path = "~/Designs/" + ($("picker-name").value.trim() || d.name + ".sc"); d.readOnly = false; write();
    };
    $("picker-save").onclick = () => finish(true);
    $("picker-cancel").onclick = () => finish(false);
    open("picker-shade", $("picker-name"));
  });
}

// Closing documents: the whole action (quit or close all) and the list of unsaved work.
function start(kind, only) {
  action = kind; rowNote = {};
  closing = only ? [only] : docs.slice(); // only the documents this action closes (SPEC 1.3)
  const unsaved = closing.filter((d) => d.dirty);
  if (unsaved.length === 0) return finishAction();
  if (unsaved.length === 1) return askOne(unsaved[0]);
  for (const d of docs) d.listed = closing.includes(d) && d.dirty;
  for (const d of unsaved) d.ticked = true; // SPEC 2.4: every row starts ticked
  showList();
}
function finishAction() {
  closeAll();
  const left = closing.filter((d) => docs.includes(d));
  const n = left.length;
  const lost = left.filter((d) => d.dirty).map((d) => d.name);
  const how = lost.length ? `not saved, as you chose: ${lost.join(", ")}.` : "nothing was lost.";
  if (action === "quit") log(`Quit: ${n} document${n === 1 ? "" : "s"} closed; ${how}`, lost.length ? undefined : "good");
  else if (action === "close") log(`Closed ${n} tab${n === 1 ? "" : "s"}; ${how}`, lost.length ? undefined : "good");
  else if (left.length && !left[0].dirty) log(`Closed ${left[0].name}.`, "good");
  remember(left);
  docs = docs.filter((d) => !closing.includes(d));
  if (!docs.some((d) => d.id === front) && docs.length) front = docs[0].id;
  render();
}
function closeDoc(d) { remember([d]); docs = docs.filter((x) => x !== d); }

// What a real app can reopen: a document from its file, as last saved. Changes closed without
// saving are gone, and a document never saved has no file to reopen. That's why the list asks.
function remember(closed) {
  if (closed.length) closedGroups.push(closed.map((d) => ({ name: d.name, path: d.path, lost: d.dirty })));
}
function reopen() {
  const group = closedGroups.pop();
  if (!group) return;
  for (const c of group) {
    if (!c.path) { log(`${c.name} was never saved, so there is no file to reopen. Its work is gone.`, "bad"); continue; }
    const d = { name: c.name, path: c.path, dirty: false, readOnly: false, fails: false, id: nextId++ };
    docs.push(d); front = d.id;
    log(c.lost ? `Reopened ${c.name} from its file. The changes closed without saving are gone.` : `Reopened ${c.name}.`, c.lost ? "bad" : "good");
  }
  render();
}
function newDoc() {
  const taken = new Set(docs.map((d) => d.name));
  let n = 1, name = "Untitled";
  while (taken.has(name)) name = `Untitled ${++n}`; // SPEC 6.3: same-named documents told apart
  const d = { name, path: null, dirty: false, readOnly: false, fails: false, id: nextId++ };
  docs.push(d); front = d.id;
  log(`New document ${name}. Tick "Unsaved changes" to pretend you worked on it.`);
  render();
}

function showList() {
  // Every document the list opened with keeps its row until it closes; one that saved shows it (SPEC 3.1.1).
  const listed = docs.filter((d) => d.listed);
  const left = listed.filter((d) => d.dirty).length;
  if (left === 0) return finishAction(); // SPEC 4.3
  $("list-title").textContent = `Save changes to ${left} design${left === 1 ? "" : "s"}?`;
  $("rows").replaceChildren(...listed.map((d) => {
    const row = document.createElement("div");
    row.className = "row"; row.setAttribute("role", "group"); row.setAttribute("aria-label", d.name);
    row.innerHTML = `<input type="checkbox"><button class="name"></button>
      <span class="acts"><button class="small save">Save</button><button class="small discard">Discard</button></span>
      <span class="where"></span>`;
    const tick = row.querySelector("input");
    tick.checked = d.ticked && d.dirty; tick.disabled = !d.dirty; tick.setAttribute("aria-label", "Save " + d.name);
    tick.onchange = () => { d.ticked = tick.checked; };
    const name = row.querySelector(".name");
    name.textContent = d.name; name.title = "Show this document";
    name.onclick = () => { front = d.id; render(); };
    row.querySelector(".where").textContent = d.path || "Not saved yet";
    if (rowNote[d.id]) {
      const note = document.createElement("span");
      note.className = "note " + rowNote[d.id][0]; note.textContent = rowNote[d.id][1];
      row.append(note);
    }
    const saveBtn = row.querySelector(".save"), discardBtn = row.querySelector(".discard");
    saveBtn.setAttribute("aria-label", "Save " + d.name); discardBtn.setAttribute("aria-label", "Discard " + d.name);
    saveBtn.disabled = discardBtn.disabled = !d.dirty;
    saveBtn.onclick = async () => { if (await save(d)) { closeDoc(d); log(`Closed ${d.name}`); } render(); showList(); }; // SPEC 4.1
    discardBtn.onclick = () => { closeDoc(d); log(`Discarded ${d.name}`); render(); showList(); };      // SPEC 4.2
    return row;
  }));
  open("list-shade");
}
$("save-selected").onclick = async () => {
  const listed = docs.filter((d) => d.listed);
  let allSaved = true;
  for (const d of listed.filter((d) => d.ticked && d.dirty)) {
    if (!(await save(d))) { allSaved = false; break; }
  }
  if (!allSaved) { log("Nothing closed: one save didn't happen. Fix it and try again.", "bad"); render(); return showList(); } // SPEC 3.1.1
  for (const d of listed.filter((d) => d.dirty)) log(`Closed ${d.name} without saving`);
  finishAction();
};
$("dont-save").onclick = () => { for (const d of docs.filter((d) => d.listed && d.dirty)) log(`Closed ${d.name} without saving`); finishAction(); };
$("cancel").onclick = () => { closeAll(); log("Cancelled: everything is still open."); render(); };

function askOne(d) { // SPEC 1.2: one unsaved document keeps the single prompt
  $("one-title").textContent = `Save changes to “${d.name}”?`;
  $("one-note").textContent = d.path || "Not saved yet";
  $("one-save").onclick = async () => { $("one-shade").classList.remove("open"); if (await save(d)) finishAction(); else { log("Nothing closed.", "bad"); render(); } };
  $("one-dont").onclick = () => { log(`Closed ${d.name} without saving`); finishAction(); };
  $("one-cancel").onclick = () => { closeAll(); log("Cancelled: everything is still open."); render(); };
  open("one-shade");
}

// SPEC 5.1: Enter is the default button, Escape is Cancel, in every prompt.
document.addEventListener("keydown", (e) => {
  const top = ["picker-shade", "one-shade", "list-shade"].find((id) => $(id).classList.contains("open"));
  if (!top) return;
  if (e.key === "Escape") { e.preventDefault(); ({ "picker-shade": $("picker-cancel"), "one-shade": $("one-cancel"), "list-shade": $("cancel") })[top].click(); }
  if (e.key === "Enter" && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); $(top).querySelector("button.primary").click(); }
});
$("quit").onclick = () => start("quit");
$("close-all").onclick = () => start("close");
$("reset").onclick = reset;
$("reopen").onclick = reopen;
reset();
</script>
</body>
</html>
