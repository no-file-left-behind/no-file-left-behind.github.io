<title>No File Left Behind — demo</title>
<meta name="description" content="Closing several documents at once? Ask once, in one list, and never close anything if a save fails. Try the open pattern.">

<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1d2129; --muted: #69707d; --line: #d9dce1;
    --accent: #2f6fde; --accent-text: #ffffff; --danger: #c4302b; --ok: #1f8a4c; --shade: rgba(20, 24, 31, 0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181d; --panel: #22252c; --text: #e7e9ee; --muted: #9aa1ad; --line: #383c45;
      --accent: #4a8bf2; --accent-text: #ffffff; --danger: #ef6b66; --ok: #4cc283; --shade: rgba(0, 0, 0, 0.55); }
  }
  * { box-sizing: border-box; }
  .embedded .topbar, .embedded main > h1, .embedded main > p.lead { display: none; }
  .embedded main { padding-top: 16px; padding-bottom: 16px; }
  a { color: var(--accent); }
  /* The list itself is the <unsaved-list> element; it takes this page's colours. */
  unsaved-list { --nflb-panel: var(--panel); --nflb-text: var(--text); --nflb-muted: var(--muted); --nflb-line: var(--line); --nflb-hover: var(--bg);
    --nflb-accent: var(--accent); --nflb-danger: var(--danger); --nflb-ok: var(--ok); --nflb-backdrop: var(--shade); }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  .app { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab { display: flex; align-items: center; border: 1px solid var(--line); border-bottom: none; border-radius: 8px 8px 0 0; background: var(--bg); }
  .tab button { border: none; background: none; border-radius: 6px; }
  .tab .open-tab { padding: 6px 4px 6px 12px; }
  .tab .x { padding: 2px 8px; margin-right: 4px; color: var(--muted); }
  .tab .x:hover { background: var(--line); color: var(--text); }
  .tabs .new-tab { border: none; background: none; padding: 4px 10px; font-size: 18px; line-height: 1; color: var(--muted); }
  .tabs .new-tab:hover { color: var(--text); background: var(--bg); }
  .tab.front { background: var(--panel); outline: 2px solid var(--accent); outline-offset: -2px; }
  .tab.front .open-tab { font-weight: 600; }
  .doc.front { outline: 2px solid var(--accent); outline-offset: -1px; }
  .docs { padding: 12px; display: grid; gap: 8px; }
  .doc { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
  .doc .where { color: var(--muted); font-size: 13px; }
  .doc .switches { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
  .bar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.small { padding: 2px 10px; font-size: 13px; }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .log { margin-top: 16px; font-size: 13px; color: var(--muted); }
  .log li.bad { color: var(--danger); } .log li.good { color: var(--ok); }
  dialog.dialog { padding: 0; margin: auto; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    width: min(460px, calc(100vw - 32px)); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
  dialog.dialog::backdrop { background: var(--shade); }
  .dialog h2 { font-size: 17px; margin: 0; padding: 16px 18px 8px; }
  .foot { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .foot .spacer { flex: 1; }
  .dialog p { margin: 0; padding: 4px 18px 8px; }
  .docs .empty { margin: 0; padding: 18px 6px; color: var(--muted); }
  .dialog label.field { display: block; padding: 4px 18px 8px; }
  .dialog input[type=text] { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
</style>
</head>
<body>
<header class="topbar">
  <div class="inner">
    <a class="brand" href="../">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      No File Left Behind
    </a>
    <nav aria-label="Site">
      <a class="github" href="https://github.com/raykholo/no-file-left-behind">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub
      </a>
      <a href="./" aria-current="page">Try the demo</a>
      <a href="../SPEC.html">Spec</a>
      <a href="../IMPLEMENT.html">Implement</a>
      <a href="../CHECKLIST.html">Checklist</a>
    </nav>
  </div>
</header>
<main>
  <h1>Try it</h1>
  <p class="lead">A pretend app with four documents. Change them, set the switches, then quit. Try making one fail or
    cancelling a "Save as": nothing closes. The list is the <a href="https://github.com/raykholo/no-file-left-behind/tree/main/implementations/web">web component</a> from this project. <a href="../SPEC.html">Specification</a></p>

  <div class="app">
    <div class="tabs" id="tabs"></div>
    <div class="docs" id="docs"></div>
    <div class="bar">
      <button class="primary" id="quit">Quit</button>
      <button id="close-all">Close All Tabs</button>
      <button id="reopen" title="Reopen what you closed last">Reopen Closed Tab</button>
      <button id="reset">Start over</button>
    </div>
  </div>
  <ol class="log" id="log" aria-live="polite"></ol>
</main>

<!-- The list of unsaved work, and the single prompt: the project's own web component -->
<unsaved-list id="list"></unsaved-list>

<!-- A pretend "Save as" picker -->
<dialog class="dialog" id="picker" aria-labelledby="picker-title">
  <h2 id="picker-title"></h2>
  <label class="field">File name <input type="text" id="picker-name"></label>
  <div class="foot">
    <span class="spacer"></span>
    <button id="picker-cancel">Cancel</button>
    <button class="primary" id="picker-save">Save</button>
  </div>
</dialog>

<script type="module">
import "../implementations/web/unsaved-list.js";

const $ = (id) => document.getElementById(id);
const list = $("list");
// Embedded in the site's front page (?embed): no bar or heading of its own, and it tells the page
// its height so the frame fits it.
const embedded = new URLSearchParams(location.search).has("embed");
if (embedded) {
  document.documentElement.classList.add("embedded");
  const tell = () => parent.postMessage({ nflbHeight: document.querySelector("main").getBoundingClientRect().bottom + 8 }, "*");
  new ResizeObserver(tell).observe(document.body);
  addEventListener("load", tell);
}
// On the front page the demo sits in a frame: tell the page where a prompt is, so it can bring it
// into view, clear of its top bar.
function tellPage(dialog) {
  if (!embedded) return;
  const r = dialog.getBoundingClientRect();
  parent.postMessage({ nflbPrompt: { top: r.top, bottom: r.bottom } }, "*");
}
const START = [
  { name: "Bracket", path: "~/Designs/Bracket.sc", dirty: true },
  { name: "Lid", path: "~/Designs/Lid.sc", dirty: true },
  { name: "Untitled", path: null, dirty: true },
  { name: "Gearbox", path: "~/Designs/Gearbox.sc", dirty: false },
];
let docs, front, nextId, closedGroups, hasQuit;
const byId = (id) => docs.find((d) => d.id === id);

function reset() {
  docs = START.map((d, i) => ({ ...d, id: i, readOnly: false, fails: false, slow: false }));
  nextId = docs.length; closedGroups = [];
  front = 0; hasQuit = false;
  $("log").replaceChildren();
  render();
}
function log(text, kind) {
  const li = document.createElement("li");
  li.textContent = text;
  if (kind) li.className = kind;
  $("log").append(li);
}
function render() {
  $("tabs").setAttribute("role", "tablist");
  $("tabs").replaceChildren(...docs.map((d) => {
    const t = document.createElement("span");
    t.className = "tab" + (d.id === front ? " front" : "");
    t.innerHTML = `<button class="open-tab" role="tab"></button><button class="x">×</button>`;
    const openBtn = t.querySelector(".open-tab"), x = t.querySelector(".x");
    openBtn.textContent = d.name + (d.dirty ? " •" : "");
    openBtn.setAttribute("aria-selected", String(d.id === front));
    openBtn.title = d.dirty ? `${d.name} has unsaved changes` : d.name;
    openBtn.onclick = () => { front = d.id; render(); };
    x.title = "Close " + d.name; x.setAttribute("aria-label", "Close " + d.name);
    x.onclick = () => start("tab", d); // one document: its own prompt (SPEC 1.2)
    return t;
  }));
  const plus = document.createElement("button");
  plus.className = "new-tab"; plus.textContent = "+"; plus.title = "New document"; plus.setAttribute("aria-label", "New document");
  plus.onclick = newDoc;
  $("tabs").append(plus);
  $("reopen").disabled = closedGroups.length === 0;
  const empty = docs.length === 0;
  $("quit").disabled = $("close-all").disabled = empty;
  $("quit").classList.toggle("primary", !empty); $("reset").classList.toggle("primary", empty);
  if (empty) {
    const note = document.createElement("p");
    note.className = "empty";
    note.textContent = (hasQuit ? "The app has quit." : "No documents are open.") + " Press Start over to run it again.";
    return $("docs").replaceChildren(note);
  }
  $("docs").replaceChildren(...docs.map((d) => {
    const row = document.createElement("div");
    row.className = "doc" + (d.id === front ? " front" : "");
    row.innerHTML = `<div><strong></strong><div class="where"></div></div>
      <div class="switches">
        <label><input type="checkbox" data-k="dirty"> Unsaved changes</label>
        <label><input type="checkbox" data-k="readOnly"> Read-only file</label>
        <label><input type="checkbox" data-k="fails"> Save will fail</label>
        <label><input type="checkbox" data-k="slow"> Slow save</label>
      </div>`;
    row.querySelector("strong").textContent = d.name;
    row.querySelector(".where").textContent = d.path || "Not saved yet";
    for (const box of row.querySelectorAll("input")) {
      box.checked = d[box.dataset.k];
      box.disabled = box.dataset.k === "readOnly" && !d.path;
      box.onchange = () => { d[box.dataset.k] = box.checked; render(); };
    }
    return row;
  }));
}

// The app's side of the bargain: it does the saving and the asking where. The list never touches a file.
async function save(doc, path, signal) {
  const d = byId(doc.id);
  if (d.slow) { // SPEC 6.2: Cancel during a slow save abandons it, and the original file is left as it was
    await new Promise((done, abandon) => {
      const t = setTimeout(done, 2500);
      signal.addEventListener("abort", () => { clearTimeout(t); abandon(new Error("abandoned")); });
    });
  }
  if (d.fails) { log(`${d.name}: save failed (disk full)`, "bad"); throw new Error("The disk is full: free some space and try again."); }
  d.path = path; d.readOnly = false; d.dirty = false;
  log(`Saved ${d.name} to ${path}`, "good"); render();
}
// Asked only for a document with no file to write to (SPEC 3.1, 6.1), and it names the document.
function pick(doc, why) {
  const d = byId(doc.id), dialog = $("picker");
  return new Promise((done) => {
    $("picker-title").textContent = why === "read-only" ? `${d.name} is read-only. Save a copy as…` : `Save “${d.name}” as…`;
    $("picker-name").value = d.name + ".sc";
    const finish = (path) => { dialog.close(); if (!path) log(`${d.name}: “Save as” cancelled`, "bad"); done(path); };
    $("picker-save").onclick = () => finish("~/Designs/" + ($("picker-name").value.trim() || d.name + ".sc"));
    $("picker-cancel").onclick = () => finish(null);
    dialog.oncancel = (e) => { e.preventDefault(); finish(null); }; // Escape
    $("picker-name").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); $("picker-save").click(); } };
    dialog.showModal(); $("picker-name").focus(); tellPage(dialog);
  });
}

// Closing documents: quit, Close All Tabs, or one tab's ×. All three go through the same list.
async function start(kind, only) {
  if (list.open) return;
  const opener = document.activeElement;
  const closing = only ? [only] : docs.slice(); // only the documents this action closes (SPEC 1.3)
  const gone = new Set();                        // answered on their own row, so already closed (SPEC 4.1, 4.2)
  let wasBusy = false;
  const asking = list.ask(closing.map((d) => ({ id: d.id, name: d.name, path: d.path, dirty: d.dirty, readOnly: d.readOnly })), {
    save, pick,
    noun: { one: "design", other: "designs" },
    onShow: (doc) => { front = doc.id; render(); },
    onChange: (s) => {
      if (s.outcome) return;
      for (const id of s.closed) {
        if (gone.has(id)) continue;
        gone.add(id);
        const d = byId(id);
        log(s.lost.includes(id) ? `Discarded ${d.name}` : `Closed ${d.name}`);
        closeDoc(d);
      }
      if (wasBusy && !s.request && s.rows.some((r) => r.note)) log("Nothing closed: a save didn't happen. Fix it and try again.", "bad"); // SPEC 3.1.1
      wasBusy = !!s.request;
      if (!docs.some((d) => d.id === front) && docs.length) front = docs[0].id;
      render();
    },
  });
  if (list.open) tellPage(list.shadowRoot.querySelector("dialog"));
  const result = await asking;

  for (const id of result.abandoned) log(`${byId(id).name}: save abandoned. Its file is as it was.`, "bad");
  if (result.outcome === "stopped") { // SPEC 3.3: nothing more closes; a row already answered stays answered
    log(gone.size ? "Cancelled: nothing more closed. What you answered on its own row stays answered." : "Cancelled: everything is still open.");
    render(); return backToPage(opener);
  }
  const left = closing.filter((d) => docs.includes(d));
  const lost = left.filter((d) => d.dirty).map((d) => d.name);
  for (const name of lost) log(`Closed ${name} without saving`);
  const n = left.length, how = lost.length ? `not saved, as you chose: ${lost.join(", ")}.` : "nothing was lost.";
  if (kind === "quit") log(`Quit: ${n} document${n === 1 ? "" : "s"} closed; ${how}`, lost.length ? undefined : "good");
  else if (kind === "close") log(`Closed ${n} tab${n === 1 ? "" : "s"}; ${how}`, lost.length ? undefined : "good");
  else if (left.length && !left[0].dirty) log(`Closed ${left[0].name}.`, "good");
  remember(left);
  docs = docs.filter((d) => !closing.includes(d));
  if (kind === "quit") hasQuit = true;
  if (!docs.some((d) => d.id === front) && docs.length) front = docs[0].id;
  render(); backToPage(opener);
}
// When the prompt is gone, focus returns to the button that started the action, or the nearest thing left.
function backToPage(opener) {
  (opener && opener.isConnected && !opener.disabled ? opener : $("quit").disabled ? $("reset") : $("quit")).focus();
}
function closeDoc(d) { remember([d]); docs = docs.filter((x) => x !== d); }

// What a real app can reopen: a document from its file, as last saved. Changes closed without
// saving are gone, and a document never saved has no file to reopen. That's why the list asks.
function remember(closed) {
  if (closed.length) closedGroups.push(closed.map((d) => ({ name: d.name, path: d.path, lost: d.dirty })));
}
function reopen() {
  const group = closedGroups.pop();
  if (!group) return;
  for (const c of group) {
    if (!c.path) { log(`${c.name} was never saved, so there is no file to reopen. Its work is gone.`, "bad"); continue; }
    const d = { name: c.name, path: c.path, dirty: false, readOnly: false, fails: false, slow: false, id: nextId++ };
    docs.push(d); front = d.id; hasQuit = false;
    log(c.lost ? `Reopened ${c.name} from its file. The changes closed without saving are gone.` : `Reopened ${c.name}.`, c.lost ? "bad" : "good");
  }
  render();
}
function newDoc() {
  const taken = new Set(docs.map((d) => d.name));
  let n = 1, name = "Untitled";
  while (taken.has(name)) name = `Untitled ${++n}`; // SPEC 6.3: same-named documents told apart
  const d = { name, path: null, dirty: false, readOnly: false, fails: false, slow: false, id: nextId++ };
  docs.push(d); front = d.id; hasQuit = false;
  log(`New document ${name}. Tick "Unsaved changes" to pretend you worked on it.`);
  render();
}

$("quit").onclick = () => start("quit");
$("close-all").onclick = () => start("close");
$("reset").onclick = reset;
$("reopen").onclick = reopen;
reset();
</script>
</body>
</html>
