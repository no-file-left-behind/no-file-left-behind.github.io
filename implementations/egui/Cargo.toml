[package]
name = "no-file-left-behind"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
description = "No File Left Behind for egui: one list of unsaved work when closing several documents, and nothing closes if a save fails."
license = "0BSD"
repository = "https://github.com/no-file-left-behind/no-file-left-behind.github.io"
readme = "README.md"
keywords = ["egui", "unsaved", "dialog", "save", "accessibility"]
categories = ["gui"]

[lib]
name = "no_file_left_behind"

[features]
default = ["egui"]
egui = ["dep:egui"]

[dependencies]
egui = { version = "0.37", optional = true, default-features = false, features = ["default_fonts"] }

[dev-dependencies]
serde_json = "1"
eframe = "0.37"
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[[example]]
name = "demo"
required-features = ["egui"]

[[test]]
name = "window"
required-features = ["egui"]
