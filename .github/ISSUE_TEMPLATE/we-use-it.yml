name: We use it
description: Tell us your app uses No File Left Behind. Entirely optional, and we'd love to know.
title: "We use it: <app name>"
labels: ["adopter"]
body:
  - type: markdown
    attributes:
      value: |
        You don't have to tell anyone. But if you do, your app goes in the adopters table and helps the next one decide.
  - type: input
    id: app
    attributes:
      label: App
      description: Its name and a link.
    validations:
      required: true
  - type: input
    id: since
    attributes:
      label: Since which version of your app?
  - type: input
    id: spec
    attributes:
      label: Which version of the specification?
      placeholder: "0.3"
  - type: textarea
    id: notes
    attributes:
      label: Anything to add
      description: What you built it with, what was awkward, what the spec got wrong. A screenshot is welcome.
