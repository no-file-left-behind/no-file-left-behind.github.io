name: Scenarios
on:
  push:
    branches: [main]
  pull_request:
jobs:
  reference-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scenarios/reference/run.mjs
      - run: node implementations/web/test/scenarios.mjs
  qt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev cmake ninja-build g++
      - run: cmake -S implementations/qt -B build -G Ninja -DCMAKE_CXX_FLAGS="-Wall -Wextra" && cmake --build build
      - run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
